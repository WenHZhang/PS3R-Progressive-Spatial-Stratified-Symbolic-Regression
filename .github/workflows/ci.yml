name: Package checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install wheel outside checkout
        run: |
          python -m venv /tmp/ps3r-wheel-test
          /tmp/ps3r-wheel-test/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/ps3r-wheel-test/bin/python -I -c 'from ps3r import PS3RModel; print(PS3RModel(input_dim=9))'
          /tmp/ps3r-wheel-test/bin/ps3r validate all

