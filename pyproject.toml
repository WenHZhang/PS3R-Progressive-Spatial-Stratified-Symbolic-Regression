[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ps3r"
version = "0.2.0"
description = "Progressive Spatial Stratified Symbolic Regression (PS3R)."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
authors = [{name = "Wenhui Zhang", email = "zhangwh@lreis.ac.cn"}]
keywords = ["symbolic regression", "spatial stratification", "spatial modelling"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.19.5,<3",
  "pandas>=1.1,<4",
  "scipy>=1.5,<2",
  "scikit-learn>=0.24,<2",
]

[project.urls]
Source = "https://github.com/WenHZhang/PS3R-Progressive-Spatial-Stratified-Symbolic-Regression"
Issues = "https://github.com/WenHZhang/PS3R-Progressive-Spatial-Stratified-Symbolic-Regression/issues"

[project.optional-dependencies]
dso-runtime = [
  "torch>=1.7,<3", "numba>=0.53", "sympy", "click", "deap", "pathos",
  "seaborn", "tqdm", "PyYAML", "Cython", "commentjson", "prettytable",
  "progress", "matplotlib", "ipython",
]
notebooks = ["jupyter"]
dev = ["build", "pytest>=7", "twine"]

[project.scripts]
ps3r = "ps3r.cli:main"
ps3r-bd = "ps3r.experiments.bd.run_bd:main"
ps3r-socd = "ps3r.experiments.socd.run_socd:main"
ps3r-simulation = "ps3r.experiments.simulation.run_simulation:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.package-data]
ps3r = ["PROVENANCE.json", "patches/*.py", "patches/*.md"]
"ps3r.experiments.bd" = ["*.csv", "*.json"]
"ps3r.experiments.socd" = ["*.csv", "*.json"]
"ps3r.experiments.simulation" = ["*.csv", "*.json", "*.ipynb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
